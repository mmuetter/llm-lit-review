services:
  pipeline:
    build: .
    image: llm-lit-review:latest
    working_dir: /app/code
    environment:
      - MISTRAL_API_KEY
      - ANTHROPIC_API_KEY
    volumes:
      - ./data:/app/data
      - ./figures:/app/figures
      - ./report:/app/report
      # plot_results.py and export_prompts.py write into the sibling supplementary/
      - ../supplementary:/supplementary
